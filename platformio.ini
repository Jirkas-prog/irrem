[env:tdisplay]
platform = espressif32@6.12.0
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
; Arduino does not infer the upload address from the custom partition CSV.
board_upload.offset_address = 0x30000
lib_deps =
    crankyoldgit/IRremoteESP8266@2.8.6
    bblanchon/ArduinoJson@6.21.5
    bodmer/TFT_eSPI@2.5.43
    knolleary/PubSubClient@2.8
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=20000000
board_build.embed_txtfiles =
    web/index.html
    web/app.js
    web/style.css
